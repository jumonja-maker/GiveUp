name: Windows bootstrap integrity

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: windows-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-integrity:
    name: windows-integrity
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout proposed PR contents
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; verified upstream tag
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate Windows runner and tracked repository artifacts
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          if ($env:RUNNER_OS -ne 'Windows') { throw 'Expected a Windows hosted runner' }
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "ImageOS=$env:ImageOS"
          Write-Host "ImageVersion=$env:ImageVersion"
          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          Write-Host ("OS={0}; Version={1}; Build={2}" -f $os.Caption, $os.Version, $os.BuildNumber)

          if ([string]::IsNullOrWhiteSpace($env:GITHUB_WORKSPACE)) {
            throw 'Missing GITHUB_WORKSPACE'
          }
          Set-Location -LiteralPath $env:GITHUB_WORKSPACE
          $isGitTree = (& git rev-parse --is-inside-work-tree)
          if ($LASTEXITCODE -ne 0 -or $isGitTree -ne 'true') {
            throw 'Checkout did not create a Git working tree'
          }

          foreach ($path in @('README.md', '.github/workflows/windows-bootstrap.yml')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required file missing: $path"
            }
            $tracked = (& git ls-files --error-unmatch -- $path 2>$null)
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($tracked -join ''))) {
              throw "Required file is not Git tracked: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Required file is empty: $path"
            }
          }

          $readme = Get-Content -LiteralPath README.md -Raw -Encoding utf8
          if ($readme -notmatch '(?m)^#\s+GiveUp\s*$') {
            throw 'README.md lacks the expected GiveUp heading'
          }
          $changes = (& git status --porcelain)
          if ($LASTEXITCODE -ne 0 -or $changes) {
            throw 'Checkout is modified or Git status failed'
          }
          Write-Host 'Windows bootstrap repository integrity checks passed.'
